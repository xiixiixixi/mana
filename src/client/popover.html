<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=380, initial-scale=1.0">
<title>Mana</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafafa;--card:#fff;--ink:#111;--gray:#666;--muted:#999;--border:#e5e5e5;--accent:#ff3b00;--accent-dim:rgba(255,59,0,.08);--green:#22c55e;--yellow:#eab308;--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:12.5px;-webkit-font-smoothing:antialiased}
body{width:380px;height:100vh;background:var(--bg);color:var(--ink);font-family:'Space Mono','SF Mono',Menlo,monospace;overflow:hidden;border-radius:10px;display:flex;flex-direction:column}
::-webkit-scrollbar{width:0}
header{position:sticky;top:0;z-index:10;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
h1{font-size:12px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--ink)}
.actions{display:flex;gap:6px;align-items:center}
.btn{padding:4px 10px;font-size:10px;font-weight:700;letter-spacing:.08em;cursor:pointer;border-radius:3px;background:transparent;border:1px solid var(--border);color:var(--ink);white-space:nowrap;font-family:inherit}
.btn-primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:active{transform:translateY(1px)}
.status-bar{padding:6px 16px;font-size:10px;color:var(--gray);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
.st{font-weight:700;flex-shrink:0}.st.ok{color:var(--green)}.st.warn{color:var(--yellow)}.st.err{color:var(--red)}.st.na{color:var(--muted)}
.legend{margin-left:auto;color:var(--muted)}
.list{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);padding:12px 14px;border:1px solid var(--border)}
.card-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.card-name{font-size:12px;font-weight:700;letter-spacing:.02em}
.card-label{font-size:10px;color:var(--gray);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-console{margin-left:auto;font-size:9px;color:var(--muted);text-decoration:none;letter-spacing:.06em;flex-shrink:0}
.card-console:hover{color:var(--accent)}
.qgrid{display:grid;grid-template-columns:7em 1fr 4ch 9ch;column-gap:10px;row-gap:5px;align-items:center}
.qtrack{font-size:10px;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbar{display:flex;gap:2px;height:9px;align-items:stretch}
.qbar b{flex:1;background:var(--border);border-radius:1px}
.qbar b.on{background:var(--ink)}
.qbar.warn b.on{background:var(--yellow)}
.qbar.crit b.on{background:var(--red)}
.qpct{font-size:11px;font-weight:700;text-align:right;white-space:nowrap}
.qpct.warn{color:var(--yellow)}.qpct.crit{color:var(--red)}.qpct.na{color:var(--muted);font-weight:400}
.qamt{font-size:11px;font-weight:700;text-align:right;white-space:nowrap;grid-column:2/4}
.qreset{font-size:10px;color:var(--gray);text-align:right;white-space:nowrap}
.qreset.na{color:var(--border)}
.card-error{font-size:10px;color:var(--accent);padding:4px 6px;background:var(--accent-dim);margin-top:6px;word-break:break-all}
/* 本地用量卡（仅 token，不含花费） */
.local-card{background:var(--card);border:1px solid var(--border);padding:12px 14px}
.local-title{font-size:10px;font-weight:700;letter-spacing:.2em;color:var(--muted);margin-bottom:7px}
.local-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:9px}
.local-stat .k{font-size:9px;color:var(--muted);letter-spacing:.08em;margin-bottom:2px}
.local-stat .v{font-size:13px;font-weight:700}
.spark{display:flex;gap:2px;height:26px;align-items:flex-end;margin-bottom:4px}
.spark i{flex:1;background:var(--ink);opacity:.85;border-radius:1px 1px 0 0;min-height:2px}
.spark i.hot{background:var(--accent)}
.spark-x{display:flex;justify-content:space-between;font-size:8px;color:var(--muted);letter-spacing:.04em}
.local-note{font-size:9px;color:var(--accent);margin-top:6px}
footer{position:sticky;bottom:0;background:var(--bg);padding:8px 16px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:9px;color:var(--muted)}
.empty{text-align:center;padding:70px 0}
.empty-num{font-size:44px;font-weight:700;color:var(--border)}
.empty-text{font-size:11px;color:var(--gray);margin-top:10px;line-height:1.7}
</style>
</head>
<body>
<header>
  <h1>Mana</h1>
  <div class="actions"><button class="btn" id="btnRefresh">refresh</button><button class="btn btn-primary" id="btnSettings">config</button></div>
</header>
<div class="status-bar"><span class="st na" id="dot">[--]</span><span id="statusText">loading…</span><span class="legend">剩% · 重置</span></div>
<div class="list" id="list"><div class="empty"><div class="empty-num">—</div><div class="empty-text">loading…</div></div></div>
<footer><span id="footerLeft">Mana</span><span>local · keychain</span></footer>
<script>
(function(){
var $=function(id){return document.getElementById(id)};
var data=[],keyStatus={},local=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
// 统一“剩余”语义：所有进度一律显示还剩多少（与 src/server/services/remaining.js 同规则）
function rem(q){
  if(q.total>0&&q.used!=null)return Math.max(0,Math.min(100,Math.round((1-q.used/q.total)*100)));
  if(q.balance!=null&&q.total>0)return Math.max(0,Math.min(100,Math.round(q.balance/q.total*100)));
  return null;
}
function minRem(quotas){var m=null;(quotas||[]).forEach(function(q){var v=rem(q);if(v!=null&&(m===null||v<m))m=v});return m}
function cls(v){return v==null?'na':v<5?'crit':v<20?'warn':''}
function stState(m){return m==null?'na':m<5?'err':m<20?'warn':'ok'}
function fmtTok(n){
  if(n>=1e9)return (n/1e9).toFixed(1)+'B';
  if(n>=1e6)return (n/1e6).toFixed(1)+'M';
  if(n>=1e3)return Math.round(n/1e3)+'k';
  return String(n);
}
function barHtml(v,clsName){
  var on=v==null?0:Math.round(v/10);
  var h='<div class="qbar'+(v!=null&&v<5?' crit':v!=null&&v<20?' warn':'')+'">';
  for(var i=0;i<10;i++)h+='<b'+(i<on?' class="on"':'')+'></b>';
  return h+'</div>';
}
function resetHtml(q){
  var r=q&&q.resetIn?String(q.resetIn):'';
  if(r)return '<span class="qreset">'+esc(r)+'</span>';
  return '<span class="qreset na" title="预付余额无重置周期">--</span>';
}
function localCardHtml(lu){
  if(!lu)return '';
  var parts=[['zcode',lu.zcode],['claude',lu.claude],['opencode',lu.opencode]].filter(function(p){return p[1]&&p[1].daily&&p[1].daily.length});
  if(!parts.length)return '';
  // 合并可折算口径的源（claude + opencode，计费等效：缓存读 0.1×/写 1.25×）。
  // Codex 除外：其 tokens_used 是平台原始口径（无缓存分项），与等效口径相加会产生
  // 误导性的巨数（如"本月 13B"）——Codex 用量看它自己的平台卡片
  var byDay={},names=[];
  parts.forEach(function(p){names.push(p[0]);(p[1].daily||[]).forEach(function(e){
    var t=e.weightedTokens!=null?e.weightedTokens:(e.inputTokens||0)+(e.outputTokens||0)+(e.cacheRead||0)+(e.cacheCreate||0);
    byDay[e.date]=(byDay[e.date]||0)+t;
  })});
  var s={today:0,week:0,month:0};
  parts.forEach(function(p){s.today+=p[1].summary.todayTokens||0;s.week+=p[1].summary.weekTokens||0;s.month+=p[1].summary.monthTokens||0});
  var days=Object.keys(byDay).sort().slice(-14);
  if(!days.length)return '';
  var max=1;days.forEach(function(d){max=Math.max(max,byDay[d])});
  // 异常：某日 > 30 天均值的 3 倍
  var all=Object.keys(byDay).map(function(d){return byDay[d]});
  var mean=all.reduce(function(a,b){return a+b},0)/(all.length||1);
  var hotDay=null,hotRatio=0;
  days.forEach(function(d){var r=mean>0?byDay[d]/mean:0;if(r>3&&r>hotRatio){hotRatio=r;hotDay=d}});
  var h='<div class="local-card"><div class="local-title" title="计费等效口径：input+output+缓存读×0.1+缓存写×1.25（与额度扣减一致）。仅统计 Claude Code 与 opencode；Codex 为平台原始口径不可比，看其平台卡片">LOCAL · '+esc(names.join(' / '))+'</div>';
  h+='<div class="local-stats">'
    +'<div class="local-stat"><div class="k">今日</div><div class="v">'+fmtTok(s.today)+'</div></div>'
    +'<div class="local-stat"><div class="k">本周</div><div class="v">'+fmtTok(s.week)+'</div></div>'
    +'<div class="local-stat"><div class="k">本月</div><div class="v">'+fmtTok(s.month)+'</div></div></div>';
  h+='<div class="spark">';
  days.forEach(function(d){var pct=byDay[d]/max*100;h+='<i'+(hotDay===d?' class="hot"':'')+' style="height:'+Math.max(6,pct)+'%" title="'+d+' · '+fmtTok(byDay[d])+' tok"></i>'});
  h+='</div>';
  h+='<div class="spark-x"><span>'+esc(days[0].slice(5))+'</span><span>14d</span><span>'+esc(days[days.length-1].slice(5))+'</span></div>';
  if(hotDay)h+='<div class="local-note">! '+esc(hotDay.slice(5).replace('-','/'))+' 消耗为近30天均值的 '+hotRatio.toFixed(1)+' 倍</div>';
  h+='</div>';
  return h;
}
function render(){
  var visible=data.filter(function(p){
    if(p.status==='error')return true; // 错误也展示（排到最后），便于发现过期 Key
    if(p.apiType==='oauth'||p.apiType==='local')return true;
    return keyStatus[p.id]&&keyStatus[p.id].length>0;
  });
  var ok=visible.filter(function(p){return p.status!=='error'});
  var err=visible.filter(function(p){return p.status==='error'});
  var withPct=ok.filter(function(p){return minRem(p.quotas)!=null}).sort(function(a,b){return minRem(a.quotas)-minRem(b.quotas)});
  var balanceOnly=ok.filter(function(p){return minRem(p.quotas)==null});
  var sorted=withPct.concat(balanceOnly).concat(err);
  var m=withPct.length?Math.min.apply(null,withPct.map(function(p){return minRem(p.quotas)})):null;
  var stt=sorted.length?stState(m):'na';
  $('dot').textContent='['+(stt==='na'?'--':stt)+']';
  $('dot').className='st '+stt;
  $('statusText').textContent='updated '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})+' · '+ok.length+' platforms'+(err.length?' · '+err.length+' err':'');
  if(!sorted.length){
    $('list').innerHTML='<div class="empty"><div class="empty-num">000</div><div class="empty-text">configure API keys<br>to monitor your AI usage</div></div>';
    $('footerLeft').textContent='no keys';
    return;
  }
  $('footerLeft').textContent=m!=null?'lowest '+m+'%':'ok';
  var lh=localCardHtml(local);
  var h=lh;
  sorted.forEach(function(p){
    h+='<div class="card">';
    var label=p.label?(' · '+p.label):(p.plan?(' · '+p.plan):'');
    h+='<div class="card-head"><span class="card-name">'+esc(p.name)+'</span><span class="card-label">'+esc(label.replace(/^ · /,''))+'</span>';
    if(p.consoleUrl)h+='<a class="card-console" href="javascript:void(0)" onclick="openExt(\''+encodeURIComponent(p.consoleUrl)+'\')">console ↗</a>';
    else h+='<span style="margin-left:auto"></span>';
    h+='</div>';
    h+='<div class="qgrid">';
    (p.quotas||[]).forEach(function(q){
      var v=rem(q);
      h+='<span class="qtrack">'+esc(q.label||'额度')+'</span>';
      if(v!=null){
        h+=barHtml(v);
        h+='<span class="qpct '+cls(v)+'">'+v+'%</span>';
        h+=resetHtml(q);
      }else if(q.balance!=null){
        var amt=(q.unit||'')+(Math.round(q.balance*100)/100);
        h+='<span class="qamt">'+esc(amt)+'</span>';
        h+=resetHtml(q);
      }else if(q.unlimited){
        h+='<span></span><span class="qpct">∞</span><span class="qreset na" title="无限额度">--</span>';
      }else{
        h+='<span></span><span class="qpct na">--</span>'+resetHtml(q);
      }
    });
    if(!(p.quotas||[]).length&&p.status!=='error')h+='<span class="qtrack">无额度数据</span><span></span><span class="qpct na">--</span><span class="qreset na">--</span>';
    h+='</div>';
    if(p.status==='error'&&p.error)h+='<div class="card-error">'+esc(p.error)+'</div>';
    h+='</div>';
  });
  $('list').innerHTML=h;
}
window.openExt=function(u){window.location='mana://open?url='+u};
function refresh(){
  if(window.__USAGE__){data=window.__USAGE__.providers||window.__USAGE__||[];keyStatus=window.__KEYS__||{};render();return}
  Promise.all([
    fetch('/api/usage').then(function(r){return r.json()}),
    fetch('/api/keys/status').then(function(r){return r.json()}),
    fetch('/api/local-usage').then(function(r){return r.json()}).catch(function(){return null})
  ]).then(function(results){
    data=results[0].providers||[]; keyStatus=results[1]; local=results[2]; render();
  }).catch(function(e){
    $('statusText').textContent='err: '+e.message;
    $('dot').textContent='[err]';$('dot').className='st err';
  })
}
$('btnRefresh').onclick=function(){window.location='mana://refresh'};
$('btnSettings').onclick=function(){window.location='mana://settings'};
refresh();
setInterval(function(){window.location='mana://refresh'},60000);
})();
</script>
</body>
</html>
